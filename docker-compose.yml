services:
  frontend:
    build: .
    container_name: perp-frontend
    restart: always
    environment:
      - MAGIC_EDEN_API_KEY=${MAGIC_EDEN_API_KEY:-}
      - TENSOR_API_KEY=${TENSOR_API_KEY:-}
      - SOLSCAN_API_KEY=${SOLSCAN_API_KEY:-}
      - SOLSCAN_API_URL=${SOLSCAN_API_URL:-https://pro-api.solscan.io/v2.0}
      - SOLSCAN_ENABLED=${SOLSCAN_ENABLED:-true}
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
      - HELIUS_API_KEYS=${HELIUS_API_KEYS:-}
      - NFT_ACTIVITY_PRIMARY_PROVIDER=${NFT_ACTIVITY_PRIMARY_PROVIDER:-solscan}
      - NFT_METADATA_PRIMARY_PROVIDER=${NFT_METADATA_PRIMARY_PROVIDER:-helius}
      - PROVIDER_FALLBACK_ENABLED=${PROVIDER_FALLBACK_ENABLED:-true}
      - HELIUS_TEST_ROTATION_ENABLED=${HELIUS_TEST_ROTATION_ENABLED:-false}
      - HELIUS_TEST_FORCE_429_EVERY=${HELIUS_TEST_FORCE_429_EVERY:-0}
      - HELIUS_TEST_KEY_COOLDOWN_SECONDS=${HELIUS_TEST_KEY_COOLDOWN_SECONDS:-30}
      - HELIUS_ROTATION_ENABLED=${HELIUS_ROTATION_ENABLED:-true}
      - HELIUS_KEY_COOLDOWN_SECONDS=${HELIUS_KEY_COOLDOWN_SECONDS:-30}
      - HELIUS_KEY_CANCEL_COOLDOWN_SECONDS=${HELIUS_KEY_CANCEL_COOLDOWN_SECONDS:-1800}
      - HELIUS_REQUEST_JITTER_MS=${HELIUS_REQUEST_JITTER_MS:-0}
      - NFT_LIST_ENRICH_LISTING_ONLY=${NFT_LIST_ENRICH_LISTING_ONLY:-false}
      - NFT_LIST_ENRICH_SIGNATURES_LIMIT=${NFT_LIST_ENRICH_SIGNATURES_LIMIT:-1}
      - NFT_LIST_ENRICH_TTL_SECONDS=${NFT_LIST_ENRICH_TTL_SECONDS:-600}
      - NFT_LIST_ENRICH_REFRESH_COOLDOWN_SECONDS=${NFT_LIST_ENRICH_REFRESH_COOLDOWN_SECONDS:-30}
      - NFT_LIST_ENRICH_DRY_RUN=${NFT_LIST_ENRICH_DRY_RUN:-false}
      - NFT_LIST_ENRICH_BATCH_SIZE=${NFT_LIST_ENRICH_BATCH_SIZE:-1}
      - NFT_LIST_ENRICH_MAX_RETRIES=${NFT_LIST_ENRICH_MAX_RETRIES:-3}
      - NFT_LIST_ENRICH_FOCUS_MINT=${NFT_LIST_ENRICH_FOCUS_MINT:-}
      - PACK_OPENING_PROGRAM_IDS=${PACK_OPENING_PROGRAM_IDS:-}
      - PACK_OPENING_AUTHORITY_ADDRESSES=${PACK_OPENING_AUTHORITY_ADDRESSES:-}
      - PACK_OPENING_COLLECTION_ADDRESSES=${PACK_OPENING_COLLECTION_ADDRESSES:-}
      - PACK_OPENING_KEYWORDS=${PACK_OPENING_KEYWORDS:-pack,open,opened,reveal,claim,redeem,redeemed}
      - COLLECTOR_CRYPT_COLLECTION_ADDRESSES=${COLLECTOR_CRYPT_COLLECTION_ADDRESSES:-}
      - PHYGITALS_COLLECTION_ADDRESSES=${PHYGITALS_COLLECTION_ADDRESSES:-}
      - BEEZIE_COLLECTION_ADDRESSES=${BEEZIE_COLLECTION_ADDRESSES:-}
      - NFT_COLLECTION_ADDRESSES=${NFT_COLLECTION_ADDRESSES:-}
      - NFT_SCANNER_DRY_RUN=${NFT_SCANNER_DRY_RUN:-false}
      - ENABLE_NFT_SCANNER=${ENABLE_NFT_SCANNER:-true}
      - VERIFIED_LISTED_API_KEY=${VERIFIED_LISTED_API_KEY:-}
      - SHYFT_API_KEY=${SHYFT_API_KEY:-}
      - SHYFT_API_URL=${SHYFT_API_URL:-https://api.shyft.to/sol/v1}
      - SHYFT_ENABLED=${SHYFT_ENABLED:-true}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - perp-rwa-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=5", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  perp-rwa-data:
